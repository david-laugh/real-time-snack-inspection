worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Docker embedded DNS. Re-resolve replica hostnames periodically so that
    # scale-out replicas can join/leave without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Upstream timing is logged for bottleneck analysis (see docs/bottleneck-test-plan.md).
    log_format infer '$remote_addr [$time_local] "$request" $status '
                     'upstream=$upstream_addr '
                     'request_time=$request_time '
                     'upstream_response_time=$upstream_response_time '
                     'trace_id=$http_x_trace_id frame_id=$http_x_frame_id';
    access_log /var/log/nginx/access.log infer;

    # Round-robin (nginx default) across C3 SAM2 inference replicas.
    # - Baseline : only c3-inference-1 is running.
    # - Scale-out: c3-inference-2/3 are started with `--profile scale-out`.
    # `resolve` (nginx >= 1.27.3) prevents startup failure when 2/3 do not exist;
    # unresolvable servers are simply skipped.
    upstream c3_inference {
        zone c3_inference 64k;

        server c3-inference-1:8002 resolve max_fails=3 fail_timeout=10s;
        server c3-inference-2:8002 resolve max_fails=3 fail_timeout=10s;
        server c3-inference-3:8002 resolve max_fails=3 fail_timeout=10s;

        # TODO(Member C): evaluate `least_conn;` vs round-robin in the benchmark.
        # TODO(Member C): SAM2 video tracking keeps per-session state.
        #                 Consider `hash $http_x_session_id consistent;` for session affinity.
    }

    server {
        listen 8080;

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        # C2 -> POST /infer (body: processed-frame.schema.json)
        location /infer {
            proxy_pass http://c3_inference;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Trace-Id $http_x_trace_id;
            proxy_set_header X-Frame-Id $http_x_frame_id;
            proxy_set_header X-Session-Id $http_x_session_id;

            # TODO(Member C): tune after measuring SAM2 inference latency.
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            client_max_body_size 20m;

            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
