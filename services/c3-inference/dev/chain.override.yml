# C3 test-only compose override: run the real chain
#   C1 (WS loadgen) -> MQTT -> C2 -> Nginx -> C3 x N (GPU) -> C4 (on the host, :8003)
# without editing docker-compose.yml. Used by dev/bench_chain.py (see dev/README.md).
#
# What it changes (test containers only):
#   - c1-gateway      : mounts C2's phone fixture frames at /frames for `c1_gateway.py loadgen`
#   - c2-preprocessing: runs uvicorn (base compose still has `sleep infinity`), C2_MAX_INFLIGHT from env
#   - c3-inference-N  : sends DetectionResults to C4 running on the host
#
# Run from the repo root (paths below are relative to it):
#   MQTT_HOST_PORT=11884 docker compose -f docker-compose.yml \
#     -f services/c3-inference/compose.gpu.yml -f services/c3-inference/dev/chain.override.yml up -d ...
services:
  c1-gateway:
    volumes:
      - ./services/c2-preprocessing/tests/fixtures/phone:/frames:ro
  c2-preprocessing:
    command: ["uvicorn", "c2.app:app", "--app-dir", "src", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      C2_MAX_INFLIGHT: "${C2_MAX_INFLIGHT:-3}"
    ports:
      - "127.0.0.1:8001:8001"
  c3-inference-1:
    environment:
      C3_RESULTS_URL: ${C3_RESULTS_URL:-http://host.docker.internal:8003/results}
    extra_hosts: ["host.docker.internal:host-gateway"]
  c3-inference-2:
    environment:
      C3_RESULTS_URL: ${C3_RESULTS_URL:-http://host.docker.internal:8003/results}
    extra_hosts: ["host.docker.internal:host-gateway"]
  c3-inference-3:
    environment:
      C3_RESULTS_URL: ${C3_RESULTS_URL:-http://host.docker.internal:8003/results}
    extra_hosts: ["host.docker.internal:host-gateway"]
